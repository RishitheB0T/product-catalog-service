# BUILD FLOW 02.07 — backend/src/main/resources/application-dev.yml
# First introduced: Phase 02
# Purpose: Local-development settings, used only when the "dev" profile is active.
# Depends on: application.yml (02.06). A key set here replaces the same key from the base file.
# Used by: Spring Boot when started with the dev profile on this laptop, for example
#          .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=dev". Never active on EC2.
# Runtime role: Makes local runs easier to inspect.
#
# A profile is a named set of configuration. Spring Boot reads application.yml first, then
# application-<profile>.yml for each active profile, and the profile's values win.

# BUILD FLOW 02.07.01 — Local address and port
server:
  # Listen on the loopback address only (this computer), like the MySQL and Redis ports in Phase 03.
  # Spring Boot's default is every network interface, which would let other devices on the same network
  # reach the development server.
  address: 127.0.0.1
  # Spring Boot's default is 8080, but the development machine runs several projects and the framework
  # defaults (8080, 8081, ...) are often taken. This project therefore uses its own block of host ports,
  # 24xxx (README "Ports"); the backend gets 24081. Containers (Phase 14) keep 8080 inside their own
  # network namespace, where it cannot collide with anything on the host.
  port: 24081

# BUILD FLOW 02.07.02 — Show full health details locally
management:
  endpoint:
    health:
      # Lists every health component (disk space now; the database from Phase 04). Useful when
      # something is DOWN locally. The base and prod settings keep these details hidden.
      show-details: always

# BUILD FLOW 02.07.04 — Database connection for local development (added in Phase 04)
spring:
  config:
    # Read infra/.env (written by scripts/dev-services.ps1) as an extra properties file, so the database password
    # lives in exactly one place. "optional:" means no error if the file is missing; "[.properties]" tells Spring
    # Boot how to parse a file whose name has no known extension. The path is relative to the folder the
    # application starts in, which is backend/.
    import: optional:file:../infra/.env[.properties]
  datasource:
    # ${NAME:default} reads a property (here from infra/.env) and falls back to the value after ":" if it is
    # missing. connectionTimeZone=UTC tells the MySQL driver to treat DATETIME values as UTC, matching
    # hibernate.jdbc.time_zone in application.yml.
    url: jdbc:mysql://127.0.0.1:${MYSQL_HOST_PORT:24306}/${MYSQL_DATABASE:catalog}?connectionTimeZone=UTC
    username: ${MYSQL_USER:catalog}
    password: ${MYSQL_PASSWORD:}

# BUILD FLOW 02.07.03 — More detailed logs for our own code
logging:
  level:
    # DEBUG for classes under com.example.catalog only. Our classes start logging in Phase 05;
    # libraries stay at their default INFO level so the console remains readable.
    # logging.level is a map from logger name to level. The quoted brackets mark the whole dotted name as ONE
    # map key (Spring Boot's "bracket notation"), so the dots are never read as further nesting.
    "[com.example.catalog]": debug
