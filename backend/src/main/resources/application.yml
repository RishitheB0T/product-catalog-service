# BUILD FLOW 02.06 — backend/src/main/resources/application.yml
# First introduced: Phase 02
# Purpose: Base configuration, loaded in every environment. It holds SAFE defaults: unless a
#          profile deliberately relaxes something, the app behaves the way production should.
# Depends on: Property names defined by Spring Boot and Actuator.
# Used by: Spring Boot at startup, before any of our objects are created. The profile files
#          application-dev.yml (02.07) and application-prod.yml (02.08) are layered on top.
# Runtime role: Names the application and decides what Actuator reveals over HTTP.
#
# YAML in 30 seconds: indentation (spaces only, never tabs) creates nesting, so
#   management:
#     endpoints:
# is the property management.endpoints in .properties syntax. "key: value" sets a value and
# "#" starts a comment.
#
# Deliberately not set here: server.port. The web server uses Spring Boot's default, 8080.

# BUILD FLOW 02.06.01 — Application identity
spring:
  application:
    # Appears in log lines and, later, in metrics as the service name.
    name: catalog

  # BUILD FLOW 02.06.03 — JPA and Hibernate (added in Phase 04)
  # No database address here: each environment supplies its own (the dev profile, the test containers, and
  # environment variables in production from Phase 14). Without one, the application refuses to start.
  jpa:
    # Open Session in View keeps a database session open until the HTTP response is written, so missing data can
    # still be loaded while JSON is rendered. That hides queries and holds connections longer, so it is off: the
    # service layer loads everything a response needs inside its own transaction (Phase 05).
    open-in-view: false
    hibernate:
      # Flyway creates and changes the schema; Hibernate only checks that the entities match it and stops the
      # application on a mismatch. "update" would let Hibernate alter tables by itself: never in production.
      ddl-auto: validate
    properties:
      hibernate:
        # Read and write date-times in UTC whatever time zone the JVM runs in (this laptop runs in IST).
        jdbc:
          time_zone: UTC

  # BUILD FLOW 02.06.04 — Flyway (added in Phase 04)
  flyway:
    # Where the versioned migrations live. This is Flyway's default, written down to make it visible.
    locations: classpath:db/migration

# BUILD FLOW 02.06.05 — This application's own settings (added in Phase 05)
# Read through CatalogProperties (05.01).
catalog:
  # Creating, updating, and deleting products. Off unless a profile turns it on, so a deployment that is missing its
  # settings stays read-only instead of becoming writable (a fail-safe default, decision D-026).
  writes-enabled: false
  # BUILD FLOW 02.06.06 — Product-detail cache (added in Phase 09)
  # Read through ProductCacheProperties (09.01). Off by default in Phase 09: creates, updates, and deletes do not clear
  # cached products until Phase 10 adds after-commit eviction, so an enabled cache could serve an outdated product for
  # up to one TTL. Tests and manual checks switch it on explicitly.
  cache:
    enabled: false
    # How long a cached product stays in Redis: a longer TTL means more hits, a shorter one fresher data.
    product-ttl: 60s

# BUILD FLOW 02.06.02 — Actuator: expose only the health endpoint over HTTP
# Actuator offers many endpoints (env, beans, configprops, heapdump, ...). Several reveal
# internals such as configuration values or memory contents, so HTTP exposure is limited to
# "health". Spring Boot already defaults to this; writing it down makes the decision visible
# and testable (HealthEndpointTest checks that /actuator/env answers 404).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # never: callers see the overall status ("UP" or "DOWN") and the names of the liveness and
      # readiness probe groups that Spring Boot 4 enables automatically, but not which components
      # exist or why one failed. The dev profile shows the details; production keeps them hidden.
      show-details: never
  # BUILD FLOW 02.06.07 — Redis is not part of health (added in Phase 09)
  # The cache only speeds up reads: when Redis is down, product details come from MySQL (decision D-042). If Redis
  # counted towards health, a cache outage would mark the whole service DOWN and take it out of service.
  health:
    redis:
      enabled: false
